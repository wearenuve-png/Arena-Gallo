<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c0b">
<style>html{background:#0d0c0b;color-scheme:dark}html[data-theme=light]{background:#f4f1ec;color-scheme:light}</style>
<script>try{if(localStorage.getItem('ag_theme')==='light'){document.documentElement.dataset.theme='light';document.querySelector('meta[name="theme-color"]').content='#f4f1ec';}}catch(e){}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Eventos · Arena Gallo</title>
<meta name="description" content="Conciertos, deportes, familia, comedia, festivales y eventos corporativos en Arena Gallo.">
</head>
<body data-solid-header="1">
<main class="container" style="padding-top:calc(var(--hdr) + clamp(36px, 5vw, 64px));padding-bottom:clamp(64px, 8vw, 110px)">
  <div class="ev-head">
    <h1 class="ev-title">Cartelera</h1>
    <p class="lede" id="count" aria-live="polite"></p>
  </div>
  <div class="ev-tabs" id="tipos" role="group" aria-label="Filtrar por tipo de evento"></div>
  <div class="evgrid" id="grid"></div>
</main>
<script type="module" src="/src/pages/eventos.js"></script>
</body>
</html>
